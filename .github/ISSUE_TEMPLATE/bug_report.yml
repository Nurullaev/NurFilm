name: Сообщить об ошибке
description: Что-то работает не так в приложении
labels: [ошибка]
body:
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Видна во вкладке «Аккаунт» → «Обновления»
      placeholder: "1.24"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и версия Android
      placeholder: "Xiaomi Redmi Note 12, Android 14 / Mi TV Stick, Android TV 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что делали, что ожидали и что получилось. Если проблема с конкретным фильмом — укажите название.
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Скриншоты
      description: Если есть — перетащите сюда
